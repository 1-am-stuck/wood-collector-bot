[project]
name = "wood-collector-bot"
version = "0.1.0"
description = "Mineflayer fruit-fly connectome policy"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "safetensors>=0.4",
  "pyyaml>=6.0",
  "wandb>=0.19",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
addopts = "-q"
