[project]
name = "wood-collector-bot"
version = "0.1.0"
description = "Mineflayer fruit-fly connectome policy"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.14",
  "numpy>=2.5",
  "safetensors>=0.8",
  "pyyaml>=6.0.3",
  "wandb>=0.30",
  "python-dotenv>=1.0",
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
