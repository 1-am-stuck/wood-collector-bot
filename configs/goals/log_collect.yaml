# Ordinary GoalSpecs, one per log type. The trainer does NOT rewrite GoalToSense.
# Outer loop: census explored logs → rarest_log() → pick the spec below → apply_goal().

oak_log:
  id: collect:oak_log
  injections:
    - modality: olfaction
      pattern: { DM1: 0.4, DL5: 0.7, VA3: 0.4 }
      strength: 0.15
      falloff: tonic
    - modality: vision
      population: LC11
      strength: 0.4
      falloff: when_seen
      source_query: { kind: block, name: oak_log }
  success: { type: inventory_contains, item: oak_log, count: 1 }

